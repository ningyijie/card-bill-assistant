name: Publish NAS image
on:
  push:
    branches: [nas-custom]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Build and push NAS image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Show NAS image reference
        run: |
          echo "NAS image: ${{ steps.image.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
