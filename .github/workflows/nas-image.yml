name: Publish NAS image
on:
  push:
    branches: [nas-custom]
concurrency:
  group: publish-nas-image
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image reference
        id: image
        env:
          BEFORE_SHA: ${{ github.event.before }}
          ACR_IMAGE: ${{ vars.NAS_ACR_IMAGE }}
        run: |
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          versioned_image="$image:sha-${GITHUB_SHA:0:7}"
          branch_image="$image:nas-custom"
          build_image=true
          # Mirror the existing release when this push only installs the mirror workflow.
          if [[ -n "$ACR_IMAGE" ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null &&
             git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- . \
               ':(exclude).github/workflows/nas-image.yml' ':(exclude)scripts/nas-acr-mirror.sh'; then
            previous_image="$image:sha-${BEFORE_SHA:0:7}"
            if previous_manifest=$(docker buildx imagetools inspect --raw "$previous_image") &&
               stable_manifest=$(docker buildx imagetools inspect --raw "$branch_image") &&
               [[ -n "$previous_manifest" && "$previous_manifest" == "$stable_manifest" ]]; then
              versioned_image="$previous_image"
              build_image=false
            fi
          fi
          echo "ref=$versioned_image" >> "$GITHUB_OUTPUT"
          echo "branch_ref=$branch_image" >> "$GITHUB_OUTPUT"
          echo "build=$build_image" >> "$GITHUB_OUTPUT"
      - name: Build and push NAS image
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Publish the NAS update tag
        if: steps.image.outputs.build == 'true'
        env:
          VERSIONED_IMAGE: ${{ steps.image.outputs.ref }}
          BRANCH_IMAGE: ${{ steps.image.outputs.branch_ref }}
        run: |
          echo "Versioned NAS image: $VERSIONED_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          remote_ref=$(git ls-remote --exit-code origin refs/heads/nas-custom)
          read -r head_sha _ <<< "$remote_ref"
          if [[ "$head_sha" == "$GITHUB_SHA" ]]; then
            docker buildx imagetools create --tag "$BRANCH_IMAGE" "$VERSIONED_IMAGE"
            echo "NAS update image: $BRANCH_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install the image copying tool
        if: ${{ vars.NAS_ACR_IMAGE != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Mirror the NAS image to Alibaba Cloud ACR
        if: ${{ vars.NAS_ACR_IMAGE != '' }}
        shell: bash
        env:
          SOURCE_IMAGE: ${{ steps.image.outputs.ref }}
          TARGET_IMAGE: ${{ vars.NAS_ACR_IMAGE }}
          ACR_USERNAME: ${{ secrets.NAS_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.NAS_ACR_PASSWORD }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: bash scripts/nas-acr-mirror.sh
